<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a1a1a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Timeline</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <!-- Transport / Time / Master -->
  <header class="top">

    <div class="transport">
      <button id="btnPlay" class="btn-icon t-play" aria-label="Play/Pause">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button id="btnStop" class="btn-icon" aria-label="Stop">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <div class="time" id="timeReadout">
        <span id="current">00:00:00:00</span>
        <span class="sep">/</span>
        <span id="total">00:00:00:00</span>
      </div>
    </div>

    <div class="master">
      <div class="g">
        <label>MASTER</label>
        <input type="range" id="masterVol" min="0" max="1.5" step="0.001" value="1" />
        <span id="masterDb">0.0</span>
      </div>
      <div class="g">
        <label>ZOOM</label>
        <input type="range" id="zoom" min="20" max="800" step="1" value="100" />
        <span id="zoomVal">100</span>
      </div>
    </div>
  </header>

  <div class="main">

    <!-- Track Controls (left column) -->
    <aside class="tracks" id="tracksCol" aria-label="Track controls">
      <div class="tracks-head">
        <span>TRACKS</span>
        <span id="countBadge">0</span>
      </div>
      <div id="trackList"></div>
    </aside>

    <!-- Timeline (right) -->
    <section class="tl" id="tlCol" aria-label="Timeline">

      <!-- Ruler -->
      <div class="ruler" id="rulerWrap">
        <canvas id="rulerCv"></canvas>
        <div class="ruler-hit" id="rulerHit"></div>
      </div>

      <!-- Waveform lanes (scrollable) -->
      <div class="lanes-wrap" id="lanesWrap">
        <div class="lanes-scroll" id="lanesScroll">
          <div id="lanesInner"></div>
        </div>
        <!-- Playhead overlay (relative to lanesWrap) -->
        <div class="playhead" id="playhead">
          <div class="ph-head"></div>
          <div class="ph-line"></div>
        </div>
      </div>

    </section>
  </div>

  <footer class="status">
    <span id="stPlay" class="dot stopped"></span>
    <span id="stText">Tap Play to start</span>
    <span class="sp"></span>
    <span id="srInfo">-- kHz</span>
    <span class="vbar"></span>
    <span id="tInfo">0 tracks</span>
  </footer>
</div>

<script src="js/audio.js"></script>
<script src="js/timeline.js"></script>
<script src="js/app.js"></script>
</body>
</html>
